<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentBrother - 跨平台 Agent 管理框架</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #1a1a2e;
      color: #ffffff;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      margin-bottom: 30px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #4cc9f0;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #a9a9a9;
    }

    .frameworks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .framework-card {
      background-color: #16213e;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .framework-card:hover {
      transform: translateY(-5px);
    }

    .framework-card h2 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: #4cc9f0;
    }

    .framework-status {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .status-active {
      background-color: #4caf50;
    }

    .status-inactive {
      background-color: #f44336;
    }

    .agents-list {
      margin-top: 20px;
    }

    .agent-item {
      background-color: #0f3460;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .agent-item:hover {
      background-color: #16213e;
    }

    .chat-container {
      background-color: #16213e;
      border-radius: 10px;
      padding: 20px;
      margin-top: 30px;
    }

    .chat-messages {
      height: 400px;
      overflow-y: auto;
      margin-bottom: 20px;
      padding: 10px;
      background-color: #0f3460;
      border-radius: 8px;
    }

    .message {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 8px;
      max-width: 80%;
    }

    .message.user {
      background-color: #4cc9f0;
      color: #1a1a2e;
      align-self: flex-end;
      margin-left: auto;
    }

    .message.assistant {
      background-color: #3a0ca3;
      color: #ffffff;
      align-self: flex-start;
    }

    .chat-input {
      display: flex;
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: #0f3460;
      color: #ffffff;
      font-size: 1rem;
    }

    .chat-input button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #4cc9f0;
      color: #1a1a2e;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .chat-input button:hover {
      background-color: #4361ee;
    }

    .create-agent {
      margin-top: 20px;
      padding: 20px;
      background-color: #16213e;
      border-radius: 10px;
    }

    .create-agent h3 {
      margin-bottom: 15px;
      color: #4cc9f0;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #a9a9a9;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: #0f3460;
      color: #ffffff;
      font-size: 1rem;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn-primary {
      background-color: #4cc9f0;
      color: #1a1a2e;
    }

    .btn-primary:hover {
      background-color: #4361ee;
    }

    @media (max-width: 768px) {
      .container {
        padding: 10px;
      }

      h1 {
        font-size: 2rem;
      }

      .frameworks {
        grid-template-columns: 1fr;
      }

      .chat-messages {
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AgentBrother</h1>
      <p class="subtitle">跨平台 Agent 管理框架 - 统一管理 OpenClaw、ZeroClaw 等 Agent 框架</p>
    </header>

    <section class="frameworks" id="frameworks">
      <!-- 框架卡片将通过 JavaScript 动态生成 -->
    </section>

    <section class="chat-container" id="chat-container" style="display: none;">
      <h2 id="chat-title">与 Agent 聊天</h2>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input">
        <input type="text" id="message-input" placeholder="输入消息...">
        <button id="send-button">发送</button>
      </div>
    </section>

    <section class="create-agent" id="create-agent" style="display: none;">
      <h3>创建新 Agent</h3>
      <div class="form-group">
        <label for="agent-name">名称</label>
        <input type="text" id="agent-name" placeholder="Agent 名称">
      </div>
      <div class="form-group">
        <label for="agent-description">描述</label>
        <textarea id="agent-description" placeholder="Agent 描述"></textarea>
      </div>
      <div class="form-group">
        <label for="agent-type">类型</label>
        <select id="agent-type">
          <option value="chat">聊天</option>
          <option value="code">代码</option>
          <option value="image">图像</option>
          <option value="video">视频</option>
          <option value="audio">音频</option>
          <option value="custom">自定义</option>
        </select>
      </div>
      <button class="btn btn-primary" id="create-button">创建</button>
    </section>
  </div>

  <script>
    let currentFramework = null;
    let currentAgent = null;

    // 初始化
    async function init() {
      await loadFrameworks();
    }

    // 加载框架
    async function loadFrameworks() {
      const response = await fetch('/api/frameworks');
      const frameworks = await response.json();
      const frameworksContainer = document.getElementById('frameworks');

      frameworksContainer.innerHTML = '';

      frameworks.forEach(framework => {
        const frameworkCard = document.createElement('div');
        frameworkCard.className = 'framework-card';
        frameworkCard.innerHTML = `
          <h2>${framework.name}</h2>
          <div class="framework-status">
            <div class="status-indicator ${framework.running ? 'status-active' : 'status-inactive'}"></div>
            <span>${framework.running ? '运行中' : '未运行'}</span>
          </div>
          <div class="agents-list" id="agents-${framework.type}">
            <h3>Agents</h3>
            <!-- Agents 将通过 JavaScript 动态生成 -->
          </div>
          <button class="btn btn-primary" onclick="showCreateAgent('${framework.type}')">创建新 Agent</button>
        `;
        frameworksContainer.appendChild(frameworkCard);
        loadAgents(framework.type);
      });
    }

    // 加载 Agent
    async function loadAgents(frameworkType) {
      const response = await fetch(`/api/agents/${frameworkType}`);
      const agents = await response.json();
      const agentsContainer = document.getElementById(`agents-${frameworkType}`);

      // 清空现有内容，保留标题
      const title = agentsContainer.querySelector('h3');
      agentsContainer.innerHTML = '';
      agentsContainer.appendChild(title);

      agents.forEach(agent => {
        const agentItem = document.createElement('div');
        agentItem.className = 'agent-item';
        agentItem.innerHTML = `
          <h4>${agent.name}</h4>
          <p>${agent.description || '无描述'}</p>
        `;
        agentItem.onclick = () => startChat(frameworkType, agent);
        agentsContainer.appendChild(agentItem);
      });
    }

    // 开始聊天
    function startChat(frameworkType, agent) {
      currentFramework = frameworkType;
      currentAgent = agent;

      const chatContainer = document.getElementById('chat-container');
      const chatTitle = document.getElementById('chat-title');
      const chatMessages = document.getElementById('chat-messages');

      chatTitle.textContent = `与 ${agent.name} 聊天`;
      chatMessages.innerHTML = '';
      chatContainer.style.display = 'block';

      // 滚动到页面底部
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    // 显示创建 Agent 表单
    function showCreateAgent(frameworkType) {
      currentFramework = frameworkType;
      const createAgentContainer = document.getElementById('create-agent');
      createAgentContainer.style.display = 'block';

      // 滚动到页面底部
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    // 发送消息
    async function sendMessage() {
      const messageInput = document.getElementById('message-input');
      const message = messageInput.value.trim();

      if (!message || !currentFramework || !currentAgent) return;

      // 添加用户消息
      addMessage('user', message);
      messageInput.value = '';

      // 发送消息到服务器
      const response = await fetch('/api/message', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          framework: currentFramework,
          agentId: currentAgent.id,
          message: message
        })
      });

      const result = await response.json();
      if (result.content) {
        addMessage('assistant', result.content);
      }
    }

    // 添加消息到聊天界面
    function addMessage(role, content) {
      const chatMessages = document.getElementById('chat-messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;
      messageDiv.textContent = content;
      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // 创建 Agent
    async function createAgent() {
      const agentName = document.getElementById('agent-name').value.trim();
      const agentDescription = document.getElementById('agent-description').value.trim();
      const agentType = document.getElementById('agent-type').value;

      if (!agentName || !currentFramework) return;

      const response = await fetch('/api/agents', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          framework: currentFramework,
          config: {
            name: agentName,
            description: agentDescription,
            type: agentType
          }
        })
      });

      const agent = await response.json();
      if (agent.id) {
        // 重新加载 Agent 列表
        loadAgents(currentFramework);
        // 隐藏创建表单
        document.getElementById('create-agent').style.display = 'none';
        // 清空表单
        document.getElementById('agent-name').value = '';
        document.getElementById('agent-description').value = '';
      }
    }

    // 事件监听
    document.getElementById('send-button').addEventListener('click', sendMessage);
    document.getElementById('message-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
    document.getElementById('create-button').addEventListener('click', createAgent);

    // 初始化
    init();
  </script>
</body>
</html>
